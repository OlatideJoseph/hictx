<svg width="820" height="300" viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7bff"/>
      <stop offset="0.5" stop-color="#6c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="brandText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a99bff"/>
      <stop offset="0.55" stop-color="#7c6cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6c5cff" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="820" height="300" fill="#0b0d13"/>

  <!-- ===== MARK ===== -->
  <g transform="translate(44,54)" filter="url(#soft)">
    <rect x="0" y="0" width="192" height="192" rx="46" fill="url(#brand)"/>
    <rect x="0" y="0" width="192" height="100" rx="46" fill="url(#sheen)"/>
    <rect x="2.5" y="2.5" width="187" height="187" rx="43.5" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>

    <g transform="translate(96,96)">
      <!-- history loop: open ring (gap top-right) + rewind arrowhead -->
      <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 44 -24 A 50 50 0 1 0 50 20" stroke-width="7" stroke-opacity="0.5"/>
        <path d="M 26 -33 L 47 -24 L 38 -4" stroke-width="7" stroke-opacity="0.92"/>
      </g>
      <!-- context graph: centre node + three connected satellites -->
      <g stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-opacity="0.95">
        <line x1="0" y1="0" x2="-32" y2="-20"/>
        <line x1="0" y1="0" x2="-20" y2="30"/>
        <line x1="0" y1="0" x2="30" y2="20"/>
      </g>
      <g fill="#ffffff">
        <circle cx="0" cy="0" r="11"/>
        <circle cx="-32" cy="-20" r="7.5"/>
        <circle cx="-20" cy="30" r="7.5"/>
        <circle cx="30" cy="20" r="7.5"/>
      </g>
    </g>
  </g>

  <!-- ===== WORDMARK ===== -->
  <g transform="translate(272,0)">
    <text x="0" y="160" font-size="108" font-weight="800" letter-spacing="-5"
          fill="url(#brandText)">hictx</text>
    <text x="5" y="200" font-size="25" font-weight="600" letter-spacing="8"
          fill="#8b93a8">HISTORY&#160;CONTEXT</text>
  </g>
</svg>
