apiVersion: v1
kind: Namespace
metadata:
  name: hictx
---
# Non-secret configuration. Edit the host/origins for your domain.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hictx-config
  namespace: hictx
data:
  DJANGO_DEBUG: "false"
  ALLOWED_HOSTS: "hictx.example.com,hictx-api,localhost"
  CORS_ALLOWED_ORIGINS: "https://hictx.example.com"
  # Database (points the Django app at the in-cluster Postgres service).
  POSTGRES_DB: "hictx"
  POSTGRES_USER: "hictx"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  # Persistent git clones live on the shared volume (see the clones PVC).
  GRAPH_CLONE_ROOT: "/data/clones"
---
# Secret TEMPLATE — do NOT commit real values. Create it for real with, e.g.:
#   kubectl -n hictx create secret generic hictx-secrets \
#     --from-literal=DJANGO_SECRET_KEY="$(openssl rand -base64 48)" \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)"
# LLM keys are optional here (they can be set in-app via Settings); an env var
# overrides a stored key, so set them only if you want them cluster-managed.
apiVersion: v1
kind: Secret
metadata:
  name: hictx-secrets
  namespace: hictx
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "CHANGE-ME-generate-a-50-char-random-string"
  POSTGRES_PASSWORD: "CHANGE-ME"
  # GEMINI_API_KEY: ""
  # OPENAI_API_KEY: ""
  # ANTHROPIC_API_KEY: ""
